<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--mist:#dde7e4;--body:#23314a;--screen:#16203a;--key:#e9eef2;--op:#f2a33a;--eq:#2e8b6f;--clr:#d9553f;--ink:#16203a;--tape:#f7f4ea}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--mist);font-family:"Space Grotesk",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;color:var(--ink)}
.wrap{width:100%;max-width:360px}
h1{font-size:1rem;font-weight:600;margin:0 4px 10px;letter-spacing:.01em}
.calc{background:var(--body);border-radius:28px;padding:18px;box-shadow:0 18px 40px rgba(22,32,58,.28)}
.tape{background:var(--tape);color:var(--ink);border-radius:12px 12px 0 0;margin:0 6px;padding:10px 14px 6px;min-height:92px;max-height:92px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:.85rem;
 clip-path:polygon(0 0,100% 0,100% 100%,96% 94%,92% 100%,88% 94%,84% 100%,80% 94%,76% 100%,72% 94%,68% 100%,64% 94%,60% 100%,56% 94%,52% 100%,48% 94%,44% 100%,40% 94%,36% 100%,32% 94%,28% 100%,24% 94%,20% 100%,16% 94%,12% 100%,8% 94%,4% 100%,0 94%)}
.tape button{all:unset;cursor:pointer;display:block;text-align:right;padding:2px 0;opacity:.7;width:100%}
.tape button:hover,.tape button:focus-visible{opacity:1;text-decoration:underline}
.tape .empty{text-align:right;opacity:.5;padding-bottom:6px}
.screen{background:var(--screen);border-radius:16px;margin:-6px 0 16px;padding:22px 18px 14px;text-align:right;color:#fff;position:relative;z-index:1}
.expr{min-height:1.2em;font-size:.9rem;opacity:.6}
.val{font-size:2.6rem;font-weight:700;line-height:1.15;overflow-x:auto;white-space:nowrap}
.val.small{font-size:1.3rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{font:inherit;font-size:1.35rem;font-weight:600;height:62px;border:0;border-radius:16px;background:var(--key);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.keys button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.keys button:focus-visible,.tape button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.keys .op{background:var(--op)}
.keys .eq{background:var(--eq);color:#fff}
.keys .clr{background:var(--clr);color:#fff}
.keys .zero{grid-column:span 2}
.hint{font-size:.78rem;opacity:.65;margin:12px 4px 0}
@media (prefers-reduced-motion:reduce){.keys button{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Simple Calculator</h1>
  <div class="calc">
    <div class="tape" id="tape" aria-label="Past calculations"></div>
    <div class="screen" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="val" id="val">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="clr" data-a="clear">AC</button>
      <button data-a="neg">+/−</button>
      <button data-a="pct">%</button>
      <button class="op" data-a="op" data-v="/">÷</button>
      <button data-a="d" data-v="7">7</button>
      <button data-a="d" data-v="8">8</button>
      <button data-a="d" data-v="9">9</button>
      <button class="op" data-a="op" data-v="*">×</button>
      <button data-a="d" data-v="4">4</button>
      <button data-a="d" data-v="5">5</button>
      <button data-a="d" data-v="6">6</button>
      <button class="op" data-a="op" data-v="-">−</button>
      <button data-a="d" data-v="1">1</button>
      <button data-a="d" data-v="2">2</button>
      <button data-a="d" data-v="3">3</button>
      <button class="op" data-a="op" data-v="+">+</button>
      <button class="zero" data-a="d" data-v="0">0</button>
      <button data-a="dot">.</button>
      <button class="eq" data-a="eq">=</button>
    </div>
  </div>
  <p class="hint">Tip: you can type on your keyboard too. Tap a line on the tape to reuse its result.</p>
</main>
<script>
(function(){
  var cur="0",prev=null,op=null,fresh=false,tape=[];
  var sym={"+":"+","-":"−","*":"×","/":"÷"};
  var $val=document.getElementById("val"),$expr=document.getElementById("expr"),$tape=document.getElementById("tape");

  function fmt(n){
    if(!isFinite(n))return "Can't divide by zero";
    return String(Number(n.toPrecision(12)));
  }
  function calc(a,o,b){
    a=parseFloat(a);b=parseFloat(b);
    if(o==="+")return a+b;
    if(o==="-")return a-b;
    if(o==="*")return a*b;
    if(o==="/")return b===0?Infinity:a/b;
    return b;
  }
  function render(){
    $val.textContent=cur;
    $val.className="val"+(cur.length>14?" small":"");
    $expr.textContent=prev!==null&&op?fmt(parseFloat(prev))+" "+sym[op]:"";
    $tape.innerHTML="";
    if(!tape.length){
      var e=document.createElement("div");e.className="empty";e.textContent="Your calculations appear here";$tape.appendChild(e);
    }
    tape.slice(-3).forEach(function(t){
      var b=document.createElement("button");
      b.textContent=t.text;
      b.onclick=function(){cur=t.result;fresh=true;render();};
      $tape.appendChild(b);
    });
  }
  function digit(d){
    if(isNaN(parseFloat(cur))&&cur!=="0")cur="0";
    if(fresh){cur="0";fresh=false;if(!op)prev=null;}
    if(cur==="0")cur=d;else if(cur.replace(/[-.]/g,"").length<12)cur+=d;
    render();
  }
  function dot(){
    if(fresh){cur="0";fresh=false;}
    if(cur.indexOf(".")<0)cur+=".";
    render();
  }
  function operator(o){
    if(isNaN(parseFloat(cur)))return;
    if(op&&!fresh){prev=fmt(calc(prev,op,cur));}
    else prev=cur;
    op=o;fresh=true;
    if(prev==="Can't divide by zero"){cur=prev;prev=null;op=null;}
    render();
  }
  function equals(){
    if(!op||prev===null||isNaN(parseFloat(cur)))return;
    var r=fmt(calc(prev,op,cur));
    var text=fmt(parseFloat(prev))+" "+sym[op]+" "+fmt(parseFloat(cur))+" = "+r;
    if(r!=="Can't divide by zero")tape.push({text:text,result:r});
    cur=r;prev=null;op=null;fresh=true;
    render();
  }
  function clear(){cur="0";prev=null;op=null;fresh=false;render();}
  function back(){
    if(fresh||isNaN(parseFloat(cur)))return;
    cur=cur.length>1?cur.slice(0,-1):"0";
    if(cur==="-")cur="0";
    render();
  }
  function neg(){
    if(isNaN(parseFloat(cur))||cur==="0")return;
    cur=cur.charAt(0)==="-"?cur.slice(1):"-"+cur;render();
  }
  function pct(){
    if(isNaN(parseFloat(cur)))return;
    cur=fmt(parseFloat(cur)/100);fresh=true;render();
  }

  document.getElementById("keys").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var a=b.dataset.a,v=b.dataset.v;
    if(a==="d")digit(v);
    else if(a==="op")operator(v);
    else if(a==="dot")dot();
    else if(a==="eq")equals();
    else if(a==="clear")clear();
    else if(a==="neg")neg();
    else if(a==="pct")pct();
  });
  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(e.target.closest&&e.target.closest("button")&&(k==="Enter"||k===" "))return;
    if(/^[0-9]$/.test(k))digit(k);
    else if("+-*/".indexOf(k)>-1){e.preventDefault();operator(k);}
    else if(k==="."||k===",")dot();
    else if(k==="Enter"||k==="="){e.preventDefault();equals();}
    else if(k==="Backspace")back();
    else if(k==="Escape")clear();
    else if(k==="%")pct();
  });
  render();
})();
</script>
</body>
</html>
